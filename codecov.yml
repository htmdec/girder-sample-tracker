# The two test suites upload one report each, both from the single "coverage"
# job in .github/workflows/build-test.yaml.
#
# Nothing is reported until both are in: the suites take very different amounts
# of time, so notifying on the first upload to arrive meant a status, a comment
# and an email describing half the project.
codecov:
  notify:
    after_n_builds: 2
    # Also hold off while the run itself is still going.
    wait_for_ci: true

comment:
  after_n_builds: 2
  layout: "reach, diff, components, files"

# Components rather than per-flag paths, which is what Codecov recommends for a
# project setting this up now: they are defined here alone, so the split does
# not depend on how CI happens to label its uploads. The uploads still carry a
# flag each, but only to say which report is which.
#
# Split by extension rather than by directory, because the web client lives
# inside the python package: girder_sample_tracker/web_client/.
component_management:
  individual_components:
    - component_id: backend
      name: backend
      paths:
        # Both, because "**/" compiles to a regex that insists on at least one
        # directory level, which would drop girder_sample_tracker/__init__.py.
        - girder_sample_tracker/*.py
        - girder_sample_tracker/**/*.py
    - component_id: webclient
      name: web client
      paths:
        - girder_sample_tracker/web_client/**
