[tox]
envlist = lint,pytest
skipsdist = false

[gh-actions]
python =
  3.12: pytest, lint

[testenv]
package = wheel
wheel_build_env = .pkg

[testenv:pytest]
deps =
  -rrequirements-dev.txt
# Parallelism, because the wall clock here is pytest-girder standing a CherryPy
# server and a fresh mongo database up per test, not computing. Each test gets
# its own database, so workers do not share state and need no extra isolation.
#
# DEFAULT 4, sized for CI: .github/workflows/build-test.yaml runs on
# ubuntu-24.04, a 4-vCPU runner. A higher default would just oversubscribe it.
#
# RAISE IT LOCALLY: export PYTEST_XDIST_N=8, or pass `-- -n 8` (a later -n in
# posargs wins). Measured 2026-09-01 on a 32-thread i9-14900KF / 62 GB / NVMe,
# 114 tests, all widths green:
#
#     -n 0    57s        -n 4    13-16s      -n 16   9s
#     -n 2    29s        -n 8    8s
#
# The gain flattens at 8 (7x faster than serial); past that, worker startup
# costs more than the remaining tests save. Expect the sweet spot to move right
# as the suite grows.
#
# Mongo is the ceiling, not CPU: a per-test database means a wide run opens
# hundreds of WiredTiger files at once, and mongod aborts (WT_PANIC, exit 14)
# if it hits its default 1024 fd limit. Start it with
# `--ulimit nofile=64000:64000` before raising this much further.
#
# Debugging one test: `-n 0` via posargs.
commands =
  pytest --verbose               \
         --strict                \
         --cov=girder_sample_tracker \
         --cov-report=xml        \
         -n {env:PYTEST_XDIST_N:4} \
         {posargs}

[testenv:lint]
skip_install = true
skipdist = true
deps =
  ruff==0.16.5
commands =
  ruff check .

[pytest]
cache_dir = build/test/pytest_cache
junit_family = xunit2
testpaths = girder_sample_tracker/tests
