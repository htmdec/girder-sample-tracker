name: Testing and Linting

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

defaults:    
  run:    
    shell: bash

jobs:
  build:
    name: Server tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    services:
      mongodb:
        image: mongo:4.2
        ports:
          - 27017:27017
    steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Build web components
      run: |
        cd girder_sample_tracker/web_client
        npm ci
        npm run build
    - name: Cache tox environments
      uses: actions/cache@v6
      with:
        path: .tox
        key: ${{ matrix.python-version }}-tox-${{ hashFiles('setup.py', 'requirements-dev.txt') }}
    - name: Run Linter
      run: tox -e lint -- girder_sample_tracker
    - name: Run Tests with coverage
      env:
        GIRDER_MAX_CURSOR_TIMEOUT_MS: 60000
      run: tox -e pytest
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  ui:
    name: Web client tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    services:
      mongodb:
        image: mongo:4.2
        ports:
          - 27017:27017
    steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: girder_sample_tracker/web_client/package-lock.json
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('girder_sample_tracker/web_client/package-lock.json') }}
    # Chromium's system libraries need root, which tox does not have.
    - name: Install Chromium and its system dependencies
      working-directory: girder_sample_tracker/web_client
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - name: Cache tox environments
      uses: actions/cache@v6
      with:
        path: .tox
        key: ${{ matrix.python-version }}-tox-ui-${{ hashFiles('setup.py', 'requirements-dev.txt') }}
    - name: Run web client tests
      run: tox -e ui
    # Uploaded on failure as well as success: this is where the screenshot of
    # whatever went wrong lives, next to the trace and video of the same test.
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: girder_sample_tracker/web_client/playwright-report
        retention-days: 14
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-screenshots
        path: girder_sample_tracker/web_client/screenshots
        retention-days: 14
        if-no-files-found: warn
    - name: Upload failure traces and videos
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-failures
        path: girder_sample_tracker/web_client/test-results
        retention-days: 14
        if-no-files-found: ignore
    - name: Upload web client coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: webclient-coverage
        path: girder_sample_tracker/web_client/coverage/html
        retention-days: 14
        if-no-files-found: warn
    - name: Upload Coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: girder_sample_tracker/web_client/coverage/lcov.info
        flags: webclient
