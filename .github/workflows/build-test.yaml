name: Testing and Linting

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

defaults:    
  run:    
    shell: bash

jobs:
  build:
    name: Server tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    services:
      mongodb:
        image: mongo:4.2
        ports:
          - 27017:27017
    steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Build web components
      run: |
        cd girder_sample_tracker/web_client
        npm ci
        npm run build
    - name: Cache tox environments
      uses: actions/cache@v6
      with:
        path: .tox
        key: ${{ matrix.python-version }}-tox-${{ hashFiles('setup.py', 'requirements-dev.txt') }}
    - name: Run Linter
      run: tox -e lint -- girder_sample_tracker
    - name: Run Tests with coverage
      env:
        GIRDER_MAX_CURSOR_TIMEOUT_MS: 60000
      run: tox -e pytest
    # Handed to the "coverage" job rather than uploaded here, so that both
    # suites reach Codecov together.
    - name: Upload coverage data
      uses: actions/upload-artifact@v7
      with:
        name: backend-coverage
        path: coverage.xml
        retention-days: 1

  ui:
    name: Web client tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    services:
      mongodb:
        image: mongo:4.2
        ports:
          - 27017:27017
    steps:
    # Before the setup steps, because setup-node's npm cache and the browser
    # cache key below both need the lock file to already be on disk.
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: girder_sample_tracker/web_client/package-lock.json
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('girder_sample_tracker/web_client/package-lock.json') }}
    # Chromium's system libraries need root, which tox does not have.
    - name: Install Chromium and its system dependencies
      working-directory: girder_sample_tracker/web_client
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - name: Cache tox environments
      uses: actions/cache@v6
      with:
        path: .tox
        key: ${{ matrix.python-version }}-tox-ui-${{ hashFiles('setup.py', 'requirements-dev.txt') }}
    - name: Run web client tests
      run: tox -e ui
    # Uploaded on failure as well as success: this is where the screenshot of
    # whatever went wrong lives, next to the trace and video of the same test.
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: girder_sample_tracker/web_client/playwright-report
        retention-days: 14
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-screenshots
        path: girder_sample_tracker/web_client/screenshots
        retention-days: 14
        if-no-files-found: warn
    - name: Upload failure traces and videos
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-failures
        path: girder_sample_tracker/web_client/test-results
        retention-days: 14
        if-no-files-found: ignore
    # lcov.info for the "coverage" job, html/ for a person to read; the
    # per-test fragments under data/ are noise once they have been merged.
    - name: Upload coverage data
      uses: actions/upload-artifact@v7
      with:
        name: webclient-coverage
        path: |
          girder_sample_tracker/web_client/coverage
          !girder_sample_tracker/web_client/coverage/data
        retention-days: 14
        if-no-files-found: warn

  coverage:
    name: Coverage
    needs: [build, ui]
    runs-on: ubuntu-24.04
    steps:
    # Both reports are uploaded from one job so Codecov sees them arrive
    # together: the suites take very different amounts of time, and uploading
    # from each of them meant a half-finished picture and a notification for
    # each half. See codecov.yml, which holds the notification until both
    # uploads are in.
    - name: Checkout repo
      uses: actions/checkout@v7
    # Downloaded to where each suite writes it, so the reports are uploaded
    # from the paths they describe.
    - name: Download server coverage
      uses: actions/download-artifact@v7
      with:
        name: backend-coverage
        path: .
    - name: Download web client coverage
      uses: actions/download-artifact@v7
      with:
        name: webclient-coverage
        path: girder_sample_tracker/web_client/coverage
    # One upload carrying both reports, so Codecov has the whole picture the
    # first time it looks and reports once. The breakdown by area comes from
    # the components in codecov.yml, which need nothing at upload time.
    #
    # disable_search matters: `files` is documented as "added to the coverage
    # files found for upload", so without it the action also sweeps up whatever
    # else it finds in the workspace.
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        disable_search: true
        files: coverage.xml,girder_sample_tracker/web_client/coverage/lcov.info
